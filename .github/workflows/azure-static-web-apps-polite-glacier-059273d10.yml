name: Azure Static Web Apps CI/CD

# Production. Deploys only from a push to main, after the build and tests pass.
# Pull requests are built and previewed by the test site workflow (test-site.yml).
on:
  push:
    branches:
      - main

jobs:
  build_and_test_job:
    runs-on: ubuntu-latest
    name: Build and Test Job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build BowlPoolManager.sln --configuration Release
      - name: Test
        # KnownFailure tests fail today and are tracked in open issues; the trait is removed when each is fixed.
        run: dotnet test BowlPoolManager.Tests/BowlPoolManager.Tests.csproj --configuration Release --no-build --filter "Category!=KnownFailure"

  build_and_deploy_job:
    needs: build_and_test_job
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_GLACIER_059273D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "BowlPoolManager.Client" # explicitly points to the Client project
          api_location: "BowlPoolManager.Api"    # explicitly points to the Function App
          output_location: "wwwroot"             # The relative output path for Blazor
